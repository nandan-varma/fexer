name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: |
          xcodebuild -project fexer.xcodeproj -scheme fexer \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | \
            grep -E "error:|BUILD SUCCEEDED|BUILD FAILED"

  test:
    name: Test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Tests
        run: |
          xcodebuild test -project fexer.xcodeproj -scheme fexer \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | \
            grep -E "error:|BUILD SUCCEEDED|BUILD FAILED"

  lint:
    name: Lint
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict
