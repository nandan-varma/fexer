<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg-dark" cx="50%" cy="50%" r="70%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0E0E14"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <!-- Blades glow brighter on true-dark backgrounds -->
    <radialGradient id="blade-fill-dark" cx="512" cy="512" r="490" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="26%"  stop-color="#E8E8F0" stop-opacity="0.90"/>
      <stop offset="60%"  stop-color="#C0C0CC" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#808090" stop-opacity="0.20"/>
    </radialGradient>
    <!-- Subtle warm glow in the aperture center (amber tint — darkroom safe-light) -->
    <radialGradient id="center-glow-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFB830" stop-opacity="0.18"/>
      <stop offset="60%"  stop-color="#FFB830" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFB830" stop-opacity="0.00"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg-dark)"/>

  <!-- 6 aperture blades -->
  <rect x="427" y="32" width="170" height="390" rx="55" fill="url(#blade-fill-dark)" transform="rotate(0,   512,512)"/>
  <rect x="427" y="32" width="170" height="390" rx="55" fill="url(#blade-fill-dark)" transform="rotate(60,  512,512)"/>
  <rect x="427" y="32" width="170" height="390" rx="55" fill="url(#blade-fill-dark)" transform="rotate(120, 512,512)"/>
  <rect x="427" y="32" width="170" height="390" rx="55" fill="url(#blade-fill-dark)" transform="rotate(180, 512,512)"/>
  <rect x="427" y="32" width="170" height="390" rx="55" fill="url(#blade-fill-dark)" transform="rotate(240, 512,512)"/>
  <rect x="427" y="32" width="170" height="390" rx="55" fill="url(#blade-fill-dark)" transform="rotate(300, 512,512)"/>

  <!-- Aperture opening -->
  <circle cx="512" cy="512" r="132" fill="#000000"/>

  <!-- Amber glow inside the opening -->
  <circle cx="512" cy="512" r="132" fill="url(#center-glow-dark)"/>

  <!-- Aperture ring highlight -->
  <circle cx="512" cy="512" r="132" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>

  <!-- Inner lens element -->
  <circle cx="512" cy="512" r="52"  fill="rgba(255,184,48,0.06)"  stroke="rgba(255,184,48,0.25)"  stroke-width="1.5"/>

  <!-- Center dot -->
  <circle cx="512" cy="512" r="10"  fill="rgba(255,184,48,0.50)"/>

  <!-- Outer barrel ring -->
  <circle cx="512" cy="512" r="472" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>
</svg>
