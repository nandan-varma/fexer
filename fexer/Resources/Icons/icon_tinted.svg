<?xml version="1.0" encoding="UTF-8"?>
<!-- Tinted variant: pure grayscale — iOS 18 applies system tint color on top.
     Black background + white aperture structure is the correct pattern. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="blade-fill-tinted" cx="512" cy="512" r="490" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="26%"  stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="60%"  stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <!-- Pure black background — iOS renders tint on white areas -->
  <rect width="1024" height="1024" fill="#000000"/>

  <!-- 6 aperture blades (grayscale) -->
  <rect x="427" y="32" width="170" height="390" rx="55" fill="url(#blade-fill-tinted)" transform="rotate(0,   512,512)"/>
  <rect x="427" y="32" width="170" height="390" rx="55" fill="url(#blade-fill-tinted)" transform="rotate(60,  512,512)"/>
  <rect x="427" y="32" width="170" height="390" rx="55" fill="url(#blade-fill-tinted)" transform="rotate(120, 512,512)"/>
  <rect x="427" y="32" width="170" height="390" rx="55" fill="url(#blade-fill-tinted)" transform="rotate(180, 512,512)"/>
  <rect x="427" y="32" width="170" height="390" rx="55" fill="url(#blade-fill-tinted)" transform="rotate(240, 512,512)"/>
  <rect x="427" y="32" width="170" height="390" rx="55" fill="url(#blade-fill-tinted)" transform="rotate(300, 512,512)"/>

  <!-- Aperture opening — black -->
  <circle cx="512" cy="512" r="132" fill="#000000"/>

  <!-- Aperture ring -->
  <circle cx="512" cy="512" r="132" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Inner lens element -->
  <circle cx="512" cy="512" r="52"  fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.20)" stroke-width="1.5"/>

  <!-- Center dot -->
  <circle cx="512" cy="512" r="10"  fill="rgba(255,255,255,0.35)"/>

  <!-- Outer barrel ring -->
  <circle cx="512" cy="512" r="472" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
</svg>
