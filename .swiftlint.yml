  - vertical_parameter_alignment_on_call
  - vertical_whitespace_between_cases
  - vertical_whitespace_opening_braces
  - xct_specific_matcher

included:
  - fexer

excluded:
  - .build
  - .github

# Short single/double-letter names (x, y, r, g, b, h, s, l, dx, kp, pt, ...) are
# idiomatic throughout this codebase's coordinate/color-space math — see EditView's
# rgb2hsl/hsl2rgb helpers, ZoomDial's arc math, HistogramView's bin math.
identifier_name:
  min_length:
    warning: 1
    error: 1
  allowed_symbols:
    - "_"

line_length:
  warning: 225
  error: 280

file_length:
  warning: 550
  error: 700

type_body_length:
  warning: 450
  error: 550

function_body_length:
  warning: 90
  error: 180

cyclomatic_complexity:
  warning: 20
  error: 30

function_parameter_count:
  warning: 6
  error: 10
